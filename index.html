<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Glowing Pet — Best pet shop for your furry friends. Food, toys, and accessories."
    />
    <title>Glowing Pet ✨ | Pet Shop</title>

    <!-- Подключение шрифта Google Fonts (Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Стили проекта -->
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- 1. ШАПКА САЙТА (HEADER) -->
    <header class="header" id="header">
      <div class="container header__inner">
        <!-- Логотип -->
        <a href="#hero" class="header__logo logo" aria-label="Glowing Pet — на главную">
          <span class="logo__text">Glowing<span class="logo__accent">Pet</span></span>
          <svg
            class="logo__icon"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <!-- Иконка лапки -->
            <path
              d="M12 13c-2.5 0-5 2.2-5 4.6 0 1.9 1.6 2.9 3.2 2.9 1 0 1.3-.3 1.8-.3s.8.3 1.8.3c1.6 0 3.2-1 3.2-2.9C17 15.2 14.5 13 12 13Z"
              fill="currentColor"
            />
            <ellipse cx="6.2" cy="9.4" rx="1.7" ry="2.2" fill="currentColor" />
            <ellipse cx="9.8" cy="6.4" rx="1.7" ry="2.3" fill="currentColor" />
            <ellipse cx="14.2" cy="6.4" rx="1.7" ry="2.3" fill="currentColor" />
            <ellipse cx="17.8" cy="9.4" rx="1.7" ry="2.2" fill="currentColor" />
          </svg>
        </a>
        <!-- Навигация -->
        <nav class="header__nav nav" id="nav" aria-label="Основная навигация">
          <ul class="nav__list">
            <li class="nav__item"><a href="#hero" class="nav__link nav__link--active">Home</a></li>
            <li class="nav__item"><a href="#about" class="nav__link">About</a></li>
            <li class="nav__item"><a href="#products" class="nav__link">Products</a></li>
            <li class="nav__item"><a href="#footer" class="nav__link">Contact</a></li>
          </ul>
        </nav>
        <!-- Действия: корзина + бургер -->
        <div class="header__actions">
          <button class="cart" type="button" aria-label="Корзина, товаров: 2">
            <svg
              class="cart__icon"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <circle cx="10" cy="20" r="1.4" fill="currentColor" />
              <circle cx="18" cy="20" r="1.4" fill="currentColor" />
            </svg>
            <span class="cart__badge" id="cart-count">2</span>
          </button>
          <button
            class="burger"
            id="burger"
            type="button"
            aria-label="Открыть меню"
            aria-expanded="false"
            aria-controls="nav"
          >
            <span class="burger__line"></span>
            <span class="burger__line"></span>
            <span class="burger__line"></span>
          </button>
        </div>
      </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ СТРАНИЦЫ -->
    <main>
      <!-- 2. ГЛАВНЫЙ ЭКРАН (HERO) -->
      <section class="hero" id="hero">
        <div class="container hero__inner">
          <!-- Левая колонка: текст -->
          <div class="hero__content">
            <span class="hero__badge">Best Pet Shop</span>
            <h1 class="hero__title">
              Best Products For Your <span class="hero__title-accent">Furry Friends</span>
            </h1>
            <p class="hero__text">
              Everything your pet needs — quality food, toys and care products, delivered straight
              to your door with love and attention.
            </p>
            <a href="#products" class="btn btn--primary hero__cta"
              >Explore Products
              <svg
                class="btn__icon"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="M5 12h14M13 6l6 6-6 6"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
          </div>
          <!-- Правая колонка: картинка -->
          <div class="hero__media">
            <img
              class="hero__img"
              src="assets/images/hero-dog.png"
              alt="Весёлый корги смотрит в камеру"
              width="640"
              height="640"
              loading="eager"
              fetchpriority="high"
              decoding="async"
            />
          </div>
        </div>
      </section>

      <section class="products" id="products"></section>
    </main>

    <!-- 4. ПОДВАЛ (FOOTER) -->
    <footer class="footer" id="footer"></footer>

    <!-- Скрипты -->
    <script src="js/main.js" defer></script>
  </body>
</html>
